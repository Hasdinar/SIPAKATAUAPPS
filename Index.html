        const saved = localStorage.getItem('sipakatau_students');

        const saved = localStorage.getItem('sipakatau_attendance_records');

                  activityLogs={activityLogs}
                  onNavigate={setActiveMenu}

                  classes={classes}

                  onAddClass={(newC) => { setClasses(prev => [...prev, newC]); logActivity(`Menambah Kelas ${newC.name}`); }}
                  onUpdateClass={(upC) => { setClasses(prev => prev.map(c => c.id === upC.id ? upC : c)); logActivity(`Mengedit Kelas ${upC.name}`); }}
                  onDeleteClass={(id) => { setClasses(prev => prev.filter(c => c.id !== id)); logActivity('Menghapus Kelas'); }}

              )}

                <StudentsView 
                  session={session}
                  students={students} 
                  classes={classes} 
                  onAddStudent={(st) => { setStudents(prev => [...prev, st]); logActivity(`Menambah Murid ${st.full_name}`); }}
                  onUpdateStudent={(st) => { setStudents(prev => prev.map(s => s.id === st.id ? st : s)); logActivity(`Mengedit Murid ${st.full_name}`); }}
                  onDeleteStudent={(id) => { setStudents(prev => prev.filter(s => s.id !== id)); logActivity('Menghapus Murid'); }}
                  onImportStudents={(importedList) => { setStudents(prev => [...prev, ...importedList]); logActivity(`Impor ${importedList.length} Murid via Excel`); }}
                />
              )}

              {activeMenu === 'attendance' && (
                <AttendanceView 
                  session={session}
                  classes={classes}
                  students={students}
                  attendanceSessions={attendanceSessions}
                  attendanceRecords={attendanceRecords}
                  onSaveSession={(sess, recs) => {
                    setAttendanceSessions(prev => [sess, ...prev.filter(s => s.id !== sess.id)]);
                    setAttendanceRecords(prev => [...prev.filter(r => r.session_id !== sess.id), ...recs]);
                    logActivity(`Mencatat Kehadiran Pertemuan ${sess.meeting_no}`);
                  }}
                  onDeleteSession={(sessId) => {
                    setAttendanceSessions(prev => prev.filter(s => s.id !== sessId));
                    setAttendanceRecords(prev => prev.filter(r => r.session_id !== sessId));
                    logActivity('Menghapus Pertemuan Kehadiran');
                  }}
                />
              )}

              {activeMenu === 'curriculum' && (
                <CurriculumView 
                  session={session}
                  curriculum={curriculum}
                  onUpdateCurriculum={(newCurr) => { setCurriculum(newCurr); logActivity('Memperbarui Struktur Kurikulum & Rubrik SOLO'); }}
                />
              )}

              {activeMenu === 'assessment' && (
                <AssessmentSOLOView 
                  session={session}
                  classes={classes}
                  students={students}
                  curriculum={curriculum}
                  soloScores={soloScores}
                  onSaveScores={(updatedScores) => {
                    setSoloScores(prev => ({ ...prev, ...updatedScores }));
                    logActivity('Menyimpan Penilaian SOLO');
                  }}
                />
              )}

              {activeMenu === 'semester' && (
                <SemesterGradeView 
                  session={session}
                  classes={classes}
                  students={students}
                  semesterGrades={semesterGrades}
                  onSaveGrades={(updatedGrades) => {
                    setSemesterGrades(prev => ({ ...prev, ...updatedGrades }));
                    logActivity('Memperbarui Nilai Akhir Semester');
                  }}
                />
              )}

              {activeMenu === 'reports' && (
                <OfficialReportsView 
                  session={session}
                  school={schoolProfile}
                  teacher={teacherProfile}
                  classes={classes}
                  students={students}
                  curriculum={curriculum}
                  attendanceSessions={attendanceSessions}
                  attendanceRecords={attendanceRecords}
                  soloScores={soloScores}
                  semesterGrades={semesterGrades}
                />
              )}
            </div>
          </main>
        </div>
      );
    }

    function DashboardView({ session, teacher, school, classes, students, curriculum, attendanceSessions, attendanceRecords, soloScores, activityLogs, onNavigate }) {
      const isTeacher = session.role === 'teacher';

      // Computations
      const totalClasses = classes.length;

      const totalMeetings = attendanceSessions.length;

      // Calculate SOLO distribution
      const soloDist = useMemo(() => {
        const counts = { Prestructural: 0, Unistructural: 0, Multistructural: 0, Relational: 0, Extended: 0 };
        // Group by student for TP1
        const studentAveragedLevels = {};

        students.forEach(st => {
          let sum = 0, count = 0;
          Object.keys(soloScores).forEach(key => {
            if (key.endsWith(`_${st.id}`)) {
              sum += soloScores[key];
              count++;
            }
          });
          if (count > 0) {
            const avg = sum / count;
            if (avg < 1.5) counts.Prestructural++;
            else if (avg < 2.5) counts.Unistructural++;
            else if (avg < 3.5) counts.Multistructural++;
            else if (avg < 4.5) counts.Relational++;
            else counts.Extended++;
          }
        });
        return [
          { name: 'Prestructural', value: counts.Prestructural, fill: '#ef4444' },
          { name: 'Unistructural', value: counts.Unistructural, fill: '#f97316' },
          { name: 'Multistructural', value: counts.Multistructural, fill: '#eab308' },
          { name: 'Relational', value: counts.Relational, fill: '#3b82f6' },
          { name: 'Extended Abstract', value: counts.Extended, fill: '#8b5cf6' }
        ];
      }, [students, soloScores]);

      // Attendance Stats
      const attStats = useMemo(() => {
        let h = 0, i = 0, s = 0, a = 0, t = 0;
        attendanceRecords.forEach(r => {
          if (r.status === 'Hadir') h++;
          else if (r.status === 'Izin') i++;
          else if (r.status === 'Sakit') s++;
          else if (r.status === 'Alpa') a++;
          else if (r.status === 'Terlambat') t++;
        });
        const totalRecorded = h + i + s + a + t;
        const rate = totalRecorded > 0 ? Math.round(((h + t) / totalRecorded) * 100) : 0;
        return { h, i, s, a, t, rate };
      }, [attendanceRecords]);

      return (

          {/* Stat Cards */}

    // ==========================================
    // MODULE 4: STUDENTS MANAGEMENT & EXCEL IMPORT
    // ==========================================
    function StudentsView({ session, students, classes, onAddStudent, onUpdateStudent, onDeleteStudent, onImportStudents }) {
      const isTeacher = session.role === 'teacher';
      const [filterClass, setFilterClass] = useState(classes[0]?.id || '');
      const [searchQuery, setSearchQuery] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      
      const [formData, setFormData] = useState({
        full_name: '', nis: '', nisn: '', gender: 'L', class_id: classes[0]?.id || '', pob: '', dob: '', address: ''
      });

      // Excel Import States
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [excelPreview, setExcelPreview] = useState([]);
      const [importErrors, setImportErrors] = useState([]);

      const filteredStudents = useMemo(() => {
        return students.filter(s => {
          const matchClass = filterClass ? s.class_id === filterClass : true;
          const matchSearch = s.full_name.toLowerCase().includes(searchQuery.toLowerCase()) || s.nis.includes(searchQuery);
          return matchClass && matchSearch;
        });
      }, [students, filterClass, searchQuery]);

      const handleOpenAdd = () => {
        setEditingStudent(null);
        setFormData({ full_name: '', nis: '', nisn: '', gender: 'L', class_id: filterClass || classes[0]?.id || '', pob: '', dob: '', address: '' });
        setIsModalOpen(true);
      };

      const handleOpenEdit = (s) => {
        setEditingStudent(s);
        setFormData({ ...s });
        setIsModalOpen(true);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        // NIS Uniqueness Validation in same class
        const duplicate = students.find(s => s.class_id === formData.class_id && s.nis === formData.nis && s.id !== editingStudent?.id);
        if (duplicate) {
          alert(`NIS ${formData.nis} sudah terdaftar untuk murid lain di kelas ini!`);
          return;
        }

        if (editingStudent) {
          onUpdateStudent({ ...editingStudent, ...formData });
        } else {
          onAddStudent({ id: 's_' + Date.now(), ...formData });
        }
        setIsModalOpen(false);
      };

      // Excel Import Logic
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(sheet);

            // Validate
            const valid = [];
            const errors = [];

            json.forEach((row, idx) => {
              const rowNo = idx + 2;
              const name = row['Nama Lengkap'] || row['Nama'] || '';
              const nis = String(row['NIS'] || '').trim();
              const gender = String(row['Jenis Kelamin'] || 'L').toUpperCase().startsWith('P') ? 'P' : 'L';

              if (!name || !nis) {
                errors.push({ row: rowNo, reason: 'Nama Lengkap atau NIS kosong' });
                return;
              }

              const isDup = students.some(s => s.class_id === filterClass && s.nis === nis);
              if (isDup) {
                errors.push({ row: rowNo, reason: `NIS ${nis} sudah ada di database` });
                return;
              }

              valid.push({
                id: 's_imp_' + Date.now() + '_' + idx,
                class_id: filterClass,
                full_name: name,
                nis: nis,
                nisn: row['NISN'] ? String(row['NISN']) : '',
                gender: gender,
                pob: row['Tempat Lahir'] || '',
                dob: row['Tanggal Lahir'] || '',
                address: row['Alamat'] || ''
              });
            });

            setExcelPreview(valid);
            setImportErrors(errors);
          } catch (err) {
            alert('Gagal membaca file Excel. Pastikan format sesuai template.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleConfirmImport = () => {
        if (excelPreview.length === 0) return;
        onImportStudents(excelPreview);
        setIsImportModalOpen(false);
        setExcelPreview([]);
        setImportErrors([]);
      };

      const downloadTemplate = () => {
        const templateData = [
          { 'No': 1, 'Nama Lengkap': 'Contoh Murid A', 'NIS': '1026', 'NISN': '0081234599', 'Jenis Kelamin': 'L', 'Tempat Lahir': 'Gowa', 'Tanggal Lahir': '2011-05-10', 'Alamat': 'Jl. Hasanuddin' },
          { 'No': 2, 'Nama Lengkap': 'Contoh Murid B', 'NIS': '1027', 'NISN': '0081234598', 'Jenis Kelamin': 'P', 'Tempat Lahir': 'Sungguminasa', 'Tanggal Lahir': '2011-08-20', 'Alamat': 'Jl. Tumanurung' }
        ];
        const ws = XLSX.utils.json_to_sheet(templateData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Template_Murid");
        XLSX.writeFile(wb, "Template_Import_Murid_SIPAKATAU.xlsx");
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Header Controls */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Filter Kelas</label>
                <select value={filterClass} onChange={e => setFilterClass(e.target.value)} className="px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none">
                  {classes.map(c => <option key={c.id} value={c.id}>Kelas {c.name}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Pencarian Murid</label>
                <div className="relative">
                  <input type="text" placeholder="Cari Nama / NIS..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-primary-500 outline-none w-48 sm:w-64" />
                  <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                </div>
              </div>
            </div>

            {isTeacher && (
              <div className="flex items-center space-x-2">
                <button onClick={downloadTemplate} className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition flex items-center space-x-1.5">
                  <i data-lucide="download" className="w-3.5 h-3.5"></i>
                  <span>Template Excel</span>
                </button>
                <button onClick={() => setIsImportModalOpen(true)} className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center space-x-1.5">
                  <i data-lucide="file-up" className="w-3.5 h-3.5"></i>
                  <span>Import Excel</span>
                </button>
                <button onClick={handleOpenAdd} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs rounded-xl shadow-md shadow-primary-600/30 transition flex items-center space-x-1.5">
                  <i data-lucide="user-plus" className="w-3.5 h-3.5"></i>
                  <span>Tambah Murid</span>
                </button>
              </div>
            )}
          </div>

          {/* Table */}
          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center">
              <h4 className="font-bold text-slate-800 text-sm">Daftar Murid Terdaftar ({filteredStudents.length} Siswa)</h4>
              <span className="text-xs text-slate-400 font-medium">Menampilkan kelas aktif</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider">
                    <th className="py-3 px-4">No</th>
                    <th className="py-3 px-4">Nama Lengkap</th>
                    <th className="py-3 px-4">NIS / NISN</th>
                    <th className="py-3 px-4">JK</th>
                    <th className="py-3 px-4">TTL</th>
                    <th className="py-3 px-4">Alamat</th>
                    {isTeacher && <th className="py-3 px-4 text-center">Aksi</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-slate-700 font-medium">
                  {filteredStudents.length === 0 ? (
                    <tr>
                      <td colSpan={isTeacher ? 7 : 6} className="py-8 text-center text-slate-400">
                        Belum ada data murid terdaftar pada kelas ini.
                      </td>
                    </tr>
                  ) : filteredStudents.map((s, idx) => (

    function AttendanceView({ session, classes, students, attendanceSessions, attendanceRecords, onSaveSession, onDeleteSession }) {
      const isTeacher = session.role === 'teacher';
      const [selectedClass, setSelectedClass] = useState(classes[0]?.id || '');
      const [activeSessionId, setActiveSessionId] = useState('');
      
      // Form states for recording
      const [meetingNo, setMeetingNo] = useState(attendanceSessions.length + 1);
      const [meetingDate, setMeetingDate] = useState(new Date().toISOString().split('T')[0]);
      const [topic, setTopic] = useState('');
      const [tempStatuses, setTempStatuses] = useState({});
      const [tempNotes, setTempNotes] = useState({});

      const classStudents = useMemo(() => students.filter(s => s.class_id === selectedClass), [students, selectedClass]);
      const classSessions = useMemo(() => attendanceSessions.filter(s => s.class_id === selectedClass), [attendanceSessions, selectedClass]);

      // Load session details into form
      useEffect(() => {
        if (activeSessionId) {
          const sess = attendanceSessions.find(s => s.id === activeSessionId);
          if (sess) {
            setMeetingNo(sess.meeting_no);
            setMeetingDate(sess.date);
            setTopic(sess.topic);

            const mapS = {}, mapN = {};
            attendanceRecords.filter(r => r.session_id === activeSessionId).forEach(r => {
              mapS[r.student_id] = r.status;
              mapN[r.student_id] = r.notes || '';
            });
            setTempStatuses(mapS);
            setTempNotes(mapN);
          }
        } else {
          // Reset for new session
          setMeetingNo(classSessions.length + 1);
          setTopic('');
          const mapS = {}, mapN = {};
          classStudents.forEach(s => { mapS[s.id] = 'Hadir'; mapN[s.id] = ''; });
          setTempStatuses(mapS);
          setTempNotes(mapN);
        }
      }, [activeSessionId, selectedClass, attendanceSessions, attendanceRecords, classStudents]);

      const handleSave = (e) => {
        e.preventDefault();
        const sessId = activeSessionId || 'att_' + Date.now();
        const sessObj = {
          id: sessId,
          class_id: selectedClass,
          meeting_no: parseInt(meetingNo),
          date: meetingDate,
          topic: topic || `Pertemuan ${meetingNo}`
        };

        const recordObjs = classStudents.map(st => ({
          id: 'ar_' + sessId + '_' + st.id,
          session_id: sessId,
          student_id: st.id,
          status: tempStatuses[st.id] || 'Hadir',
          notes: tempNotes[st.id] || ''
        }));

        onSaveSession(sessObj, recordObjs);
        alert('Data kehadiran pertemuan berhasil disimpan!');
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Class Filter & Session Picker */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex flex-col sm:flex-row sm:items-center gap-4">
              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Pilih Kelas</label>
                <select value={selectedClass} onChange={e => { setSelectedClass(e.target.value); setActiveSessionId(''); }} className="px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none">
                  {classes.map(c => <option key={c.id} value={c.id}>Kelas {c.name}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Riwayat Sesi Pertemuan</label>
                <select value={activeSessionId} onChange={e => setActiveSessionId(e.target.value)} className="px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none">
                  <option value="">+ Buat Pertemuan Baru</option>
                  {classSessions.map(s => <option key={s.id} value={s.id}>Pertemuan {s.meeting_no} ({s.date}) — {s.topic}</option>)}
                </select>
              </div>
            </div>

            {isTeacher && activeSessionId && (
              <button onClick={() => { onDeleteSession(activeSessionId); setActiveSessionId(''); }} className="px-3.5 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold text-xs rounded-xl transition flex items-center space-x-1">
                <i data-lucide="trash-2" className="w-4 h-4"></i>
                <span>Hapus Sesi Ini</span>
              </button>
            )}
          </div>

          {/* Form Recording */}
          <form onSubmit={handleSave} className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden p-6 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h4 className="font-bold text-slate-800 text-sm">
                {activeSessionId ? `Edit Presensi Pertemuan ke-${meetingNo}` : `Catat Presensi Pertemuan Baru`}
              </h4>
              <span className="text-xs text-slate-400">Pencatatan Presensi Mata Pelajaran</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Nomor Pertemuan ke- *</label>
                <input type="number" required disabled={!isTeacher} value={meetingNo} onChange={e => setMeetingNo(e.target.value)} className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-primary-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Tanggal Pertemuan *</label>
                <input type="date" required disabled={!isTeacher} value={meetingDate} onChange={e => setMeetingDate(e.target.value)} className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-primary-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Materi / Topik Pembelajaran *</label>
                <input type="text" required disabled={!isTeacher} placeholder="Contoh: Hukum Mendel I Monohibrid" value={topic} onChange={e => setTopic(e.target.value)} className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-primary-500 outline-none" />
              </div>
            </div>

            {/* Attendance Matrix Table */}
            <div className="overflow-x-auto pt-2">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider">
                    <th className="py-3 px-4">No</th>
                    <th className="py-3 px-4">Nama Murid</th>
                    <th className="py-3 px-4 text-center">Status Kehadiran</th>
                    <th className="py-3 px-4">Catatan Kendala / Keterangan</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium">
                  {classStudents.map((st, idx) => (
                    <tr key={st.id} className="hover:bg-slate-50/80 transition">
                      <td className="py-3 px-4 font-bold text-slate-400">{idx + 1}</td>
                      <td className="py-3 px-4 font-bold text-slate-800">{st.full_name}</td>
                      <td className="py-3 px-4 text-center">
                        <div className="inline-flex bg-slate-100 p-1 rounded-xl space-x-1 border border-slate-200">
                          {['Hadir', 'Izin', 'Sakit', 'Terlambat', 'Alpa'].map(stt => (
                            <button
                              key={stt}
                              type="button"
                              disabled={!isTeacher}
                              onClick={() => setTempStatuses({...tempStatuses, [st.id]: stt})}
                              className={`px-2.5 py-1 text-[10px] font-bold rounded-lg transition ${
                                (tempStatuses[st.id] || 'Hadir') === stt 
                                  ? (stt === 'Hadir' ? 'bg-emerald-600 text-white shadow-sm' :
                                     stt === 'Izin' ? 'bg-blue-600 text-white shadow-sm' :
                                     stt === 'Sakit' ? 'bg-amber-500 text-white shadow-sm' :
                                     stt === 'Terlambat' ? 'bg-purple-600 text-white shadow-sm' : 'bg-red-600 text-white shadow-sm')
                                  : 'text-slate-500 hover:text-slate-900'
                              }`}
                            >
                              {stt}
                            </button>
                          ))}
                        </div>
                      </td>
                      <td className="py-3 px-4">
                        <input 
                          type="text" 
                          disabled={!isTeacher}
                          placeholder="Alasan izin / surat dokter..." 
                          value={tempNotes[st.id] || ''} 
                          onChange={e => setTempNotes({...tempNotes, [st.id]: e.target.value})}
                          className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:bg-white"
                        />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {isTeacher && (
              <div className="pt-2 flex justify-end">
                <button type="submit" className="px-6 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl text-xs shadow-lg shadow-primary-600/30 transition flex items-center space-x-2">
                  <i data-lucide="save" className="w-4 h-4"></i>
                  <span>Simpan Presensi Pertemuan</span>
                </button>
              </div>
            )}
          </form>
        </div>
      );
    }

    // ==========================================
    // MODULE 6: CURRICULUM & SOLO RUBRIC BUILDER
    // ==========================================
    function CurriculumView({ session, curriculum, onUpdateCurriculum }) {
      const isTeacher = session.role === 'teacher';
      const [expandedCp, setExpandedCp] = useState(curriculum[0]?.id || '');
      const [expandedMat, setExpandedMat] = useState(curriculum[0]?.materials[0]?.id || '');
      const [expandedTp, setExpandedTp] = useState(curriculum[0]?.materials[0]?.tps[0]?.id || '');
      const [isAiLoading, setIsAiLoading] = useState(false);

      // Trigger updates back to parent
      const saveCurr = (newC) => {
        onUpdateCurriculum(newC);
      };

      // Add CP Handler
      const handleAddCp = () => {
        const newCp = {
          id: 'cp_' + Date.now(),
          subject: 'Ilmu Pengetahuan Alam (IPA)',
          phase: 'D',
          element: 'Pemahaman IPA',
          academic_year: '2025/2026',
          description: 'Capaian Pembelajaran Baru disesuaikan dengan kurikulum mata pelajaran.',
          materials: []
        };
        saveCurr([...curriculum, newCp]);
      };

      // Add Material
      const handleAddMaterial = (cpId) => {
        const updated = curriculum.map(cp => {
          if (cp.id === cpId) {
            return {
              ...cp,
              materials: [
                ...cp.materials,
                { id: 'm_' + Date.now(), title: 'Bab / Materi Baru', description: 'Deskripsi bab baru', sort_order: cp.materials.length + 1, tps: [] }
              ]
            };
          }
          return cp;
        });
        saveCurr(updated);
      };

      // Add TP
      const handleAddTp = (cpId, matId) => {
        const updated = curriculum.map(cp => {
          if (cp.id === cpId) {
            return {
              ...cp,
              materials: cp.materials.map(m => {
                if (m.id === matId) {
                  return {
                    ...m,
                    tps: [
                      ...m.tps,
                      {
                        id: 'tp_' + Date.now(),
                        code: `TP.IPA.8.${m.tps.length + 1}`,
                        formulation: 'Rumusan Tujuan Pembelajaran (TP) Baru',
                        kktp_level: 'Multistructural',
                        kktp_config: {
                          prestructural_min: 0, prestructural_max: 59,
                          unistructural_min: 60, unistructural_max: 74,
                          multistructural_min: 75, multistructural_max: 83,
                          relational_min: 84, relational_max: 92,
                          extended_min: 93, extended_max: 100,
                          interval_width: 8
                        },
                        iktps: []
                      }
                    ]
                  };
                }
                return m;
              })
            };
          }
          return cp;
        });
        saveCurr(updated);
      };

      // Add IKTP
      const handleAddIktp = (cpId, matId, tpId) => {
        const updated = curriculum.map(cp => {
          if (cp.id === cpId) {
            return {
              ...cp,
              materials: cp.materials.map(m => {
                if (m.id === matId) {
                  return {
                    ...m,
                    tps: m.tps.map(tp => {
                      if (tp.id === tpId) {
                        return {
                          ...tp,
                          iktps: [
                            ...tp.iktps,
                            {
                              id: 'ik_' + Date.now(),
                              formulation: 'Indikator Ketercapaian (IKTP) Baru',
                              rubric: {
                                prestructural: 'Belum menunjukkan pemahaman dasar.',
                                unistructural: 'Menunjukkan pemahaman pada 1 aspek sederhana.',
                                multistructural: 'Menunjukkan pemahaman beberapa aspek secara terpisah.',
                                relational: 'Menghubungkan antar konsep secara utuh dan logis.',
                                extended: 'Menggeneralisasi dan menerapkan konsep pada situasi baru.'
                              }
                            }
                          ]
                        };
                      }
                      return tp;
                    })
                  };
                }
                return m;
              })
            };
          }
          return cp;
        });
        saveCurr(updated);
      };

      // AI Generator Simulator
      const handleGenerateAiRubric = (cpId, matId, tpId, iktpId) => {
        setIsAiLoading(true);
        setTimeout(() => {
          const updated = curriculum.map(cp => {
            if (cp.id === cpId) {
              return {
                ...cp,
                materials: cp.materials.map(m => {
                  if (m.id === matId) {
                    return {
                      ...m,
                      tps: m.tps.map(tp => {
                        if (tp.id === tpId) {
                          return {
                            ...tp,
                            iktps: tp.iktps.map(ik => {
                              if (ik.id === iktpId) {
                                return {
                                  ...ik,
                                  rubric: {
                                    prestructural: '[AI Generated] Murid mengalami miskonsepsi total mengenai indikator ini.',
                                    unistructural: '[AI Generated] Murid hanya dapat mengidentifikasi 1 fakta dasar tanpa pemahaman kontekstual.',
                                    multistructural: '[AI Generated] Murid menyebutkan beberapa fakta dan prosedur tetapi belum mengorelasikannya.',
                                    relational: '[AI Generated] Murid menghubungkan fakta-fakta menjadi struktur konsep yang padu.',
                                    extended: '[AI Generated] Murid melakukan abstraksi dan mentransfer pemahaman pada ranah hipotesis baru.'
                                  }
                                };
                              }
                              return ik;
                            })
                          };
                        }
                        return tp;
                      })
                    };
                  }
                  return m;
                })
              };
            }
            return cp;
          });
          saveCurr(updated);

    // ==========================================
    // MODULE 7: SOLO ASSESSMENT INPUT & CONVERSION
    // ==========================================
    function AssessmentSOLOView({ session, classes, students, curriculum, soloScores, onSaveScores }) {
      const isTeacher = session.role === 'teacher';
      const [selectedClass, setSelectedClass] = useState(classes[0]?.id || '');
      
      // Select Curriculum TP
      const activeCp = curriculum[0];
      const activeMat = activeCp?.materials[0];
      const activeTp = activeMat?.tps[0];

      const classStudents = useMemo(() => students.filter(s => s.class_id === selectedClass), [students, selectedClass]);
      const [localScores, setLocalScores] = useState({ ...soloScores });

      const handleScoreChange = (tpId, ikId, studentId, level) => {
        if (!isTeacher) return;
        const key = `${tpId}_${ikId}_${studentId}`;
        setLocalScores(prev => ({ ...prev, [key]: parseInt(level) }));
      };

      const handleSave = () => {
        onSaveScores(localScores);
        alert('Penilaian Taksonomi SOLO dan konversi angka berhasil disimpan!');
      };

      // Exact Deterministic Conversion Formula Calculation
      // Formula: Score = MinRange + (AvgSolo - BaseLevel) * IntervalWidth
      const calculateConversion = (studentId) => {
        if (!activeTp) return { avgSolo: 0, levelName: 'Belum Dinilai', convertedScore: 0, status: 'Belum Lengkap' };

        const iktps = activeTp.iktps;
        let sum = 0, count = 0;

        iktps.forEach(ik => {
          const score = localScores[`${activeTp.id}_${ik.id}_${studentId}`];
          if (score) {
            sum += score;
            count++;
          }
        });

        if (count < iktps.length) {
          return { avgSolo: 0, levelName: 'Belum Lengkap', convertedScore: 0, status: 'Belum Lengkap' };
        }

        const avgSolo = sum / iktps.length; // e.g. 11/3 = 3.67
        const config = activeTp.kktp_config;

        let levelName = 'Prestructural';
        let baseMin = config.prestructural_min;
        let baseLevel = 1;

        if (avgSolo >= 4.5) {
          levelName = 'Extended Abstract';
          baseMin = config.extended_min;
          baseLevel = 4;
        } else if (avgSolo >= 3.5) {
          levelName = 'Relational';
          baseMin = config.relational_min; // 84 or 75 config
          baseLevel = 3;
        } else if (avgSolo >= 2.5) {
          levelName = 'Multistructural';
          baseMin = config.multistructural_min; // 75
          baseLevel = 2;
        } else if (avgSolo >= 1.5) {
          levelName = 'Unistructural';
          baseMin = config.unistructural_min; // 60
          baseLevel = 1;
        }

        // Example match: (3.67 - 3) * 8 + 75 = 80.36
        const converted = baseMin + (avgSolo - baseLevel) * config.interval_width;
        const finalScore = Math.min(100, Math.max(0, parseFloat(converted.toFixed(2))));

        // KKTP Status
        const kktpMinLevel = activeTp.kktp_level;
        const levelOrder = ['Prestructural', 'Unistructural', 'Multistructural', 'Relational', 'Extended Abstract'];
        const isAchieved = levelOrder.indexOf(levelName) >= levelOrder.indexOf(kktpMinLevel);

        return {
          avgSolo: avgSolo.toFixed(2),
          levelName: levelName,
          convertedScore: finalScore,
          status: isAchieved ? 'Tercapai' : 'Belum Tercapai'
        };
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Header Controls */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Pilih Kelas</label>
              <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-primary-500 outline-none">
                {classes.map(c => <option key={c.id} value={c.id}>Kelas {c.name}</option>)}
              </select>
            </div>

            <div className="p-3 bg-primary-50 border border-primary-100 rounded-xl text-xs text-primary-800 flex items-center space-x-2">
              <i data-lucide="calculator" className="w-4 h-4 text-primary-600 flex-shrink-0"></i>
              <span>Rumus Konversi: <b>Nilai = Batas Bawah + (Rata SOLO − Base Level) × Interval</b></span>
            </div>
          </div>

          {/* Active TP Formulation Summary */}
          {activeTp && (
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-mono font-bold text-primary-700 bg-primary-50 px-2.5 py-0.5 rounded">{activeTp.code}</span>
                <span className="text-xs font-bold text-emerald-700">Target KKTP: {activeTp.kktp_level}</span>
              </div>
              <h4 className="font-bold text-slate-800 text-sm">{activeTp.formulation}</h4>
            </div>
          )}

          {/* Assessment Table */}
          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center">
              <h4 className="font-bold text-slate-800 text-sm">Matriks Penilaian Level SOLO Murid</h4>
              {isTeacher && (
                <button onClick={handleSave} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center space-x-1.5">
                  <i data-lucide="save" className="w-3.5 h-3.5"></i>
                  <span>Simpan Penilaian</span>
                </button>
              )}
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider">
                    <th className="py-3 px-4">Nama Murid</th>
                    {activeTp?.iktps.map((ik, i) => (
                      <th key={ik.id} className="py-3 px-3 text-center max-w-xs">
                        IKTP {i + 1}
                      </th>
                    ))}
                    <th className="py-3 px-3 text-center bg-purple-50/50">Rata SOLO</th>
                    <th className="py-3 px-3 text-center bg-purple-50/50">Level SOLO</th>
                    <th className="py-3 px-3 text-center bg-purple-50/50">Nilai Konversi</th>
                    <th className="py-3 px-3 text-center">Status KKTP</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium">
                  {classStudents.map(st => {
                    const calc = calculateConversion(st.id);
                    return (
                      <tr key={st.id} className="hover:bg-slate-50/80 transition">
                        <td className="py-3 px-4 font-bold text-slate-800">{st.full_name}</td>
                        
                        {activeTp?.iktps.map(ik => {
                          const val = localScores[`${activeTp.id}_${ik.id}_${st.id}`] || '';
                          return (
                            <td key={ik.id} className="py-3 px-3 text-center">
                              <select 
                                disabled={!isTeacher}
                                value={val} 
                                onChange={e => handleScoreChange(activeTp.id, ik.id, st.id, e.target.value)}
                                className={`px-2 py-1 border rounded-lg text-xs font-bold outline-none ${
                                  val == 1 ? 'bg-red-50 text-red-600 border-red-200' :
                                  val == 2 ? 'bg-orange-50 text-orange-600 border-orange-200' :
                                  val == 3 ? 'bg-amber-50 text-amber-600 border-amber-200' :
                                  val == 4 ? 'bg-blue-50 text-blue-600 border-blue-200' :
                                  val == 5 ? 'bg-purple-50 text-purple-600 border-purple-200' : 'bg-slate-50 text-slate-400'
                                }`}
                              >
                                <option value="">- Level -</option>
                                <option value="1">1. Prestructural</option>
                                <option value="2">2. Unistructural</option>
                                <option value="3">3. Multistructural</option>
                                <option value="4">4. Relational</option>
                                <option value="5">5. Extended Abstract</option>
                              </select>
                            </td>
                          );
                        })}

                        <td className="py-3 px-3 text-center font-bold font-mono bg-purple-50/30 text-purple-900">{calc.avgSolo}</td>
                        <td className="py-3 px-3 text-center font-bold bg-purple-50/30 text-purple-900">{calc.levelName}</td>
                        <td className="py-3 px-3 text-center font-extrabold font-mono text-slate-800 bg-purple-50/30">{calc.convertedScore}</td>
                        <td className="py-3 px-3 text-center">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            calc.status === 'Tercapai' ? 'bg-emerald-100 text-emerald-700' :
                            calc.status === 'Belum Tercapai' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-500'
                          }`}>
                            {calc.status}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

                            value={item.notes}
                            onChange={e => handleGradeChange(st.id, item.grade, e.target.value)}
                            className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:bg-white"
                          />
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 9: OFFICIAL REPORTS & PRINT EXPORT
    // ==========================================
    function OfficialReportsView({ session, school, teacher, classes, students, curriculum, attendanceSessions, attendanceRecords, soloScores, semesterGrades }) {
      const [subTab, setSubTab] = useState('attendance'); // 'attendance' | 'class_scores' | 'individual'
      const [reportType, setReportType] = useState('proses'); // 'proses' | 'semester'
      const [selectedClass, setSelectedClass] = useState(classes[0]?.id || '');
      const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || '');
      const [aiDescLoading, setAiDescLoading] = useState(false);
      const [aiDescription, setAiDescription] = useState('Murid telah menunjukkan pemahaman tingkat Relational pada materi Pewarisan Sifat.');

      const printRef = useRef(null);

      const classStudents = useMemo(() => students.filter(s => s.class_id === selectedClass), [students, selectedClass]);
      const activeClassObj = useMemo(() => classes.find(c => c.id === selectedClass), [classes, selectedClass]);

      // Print function
      const handlePrint = () => {
        const content = printRef.current.innerHTML;
        const win = window.open('', '', 'height=700,width=900');
        win.document.write('<html><head><title>Cetak Laporan Official SIPAKATAU</title>');
        win.document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
        win.document.write('</head><body class="p-8 bg-white">');
        win.document.write(content);
        win.document.write('</body></html>');
        win.document.close();
        setTimeout(() => win.print(), 500);
      };

      // Export Excel Helper
      const exportExcelReport = () => {
        const dataToExport = classStudents.map((st, i) => ({
          'No': i + 1,
          'Nama Murid': st.full_name,
          'NIS': st.nis,
          'Kelas': activeClassObj?.name,
          'Status Kehadiran Rate': '90%'
        }));

        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Laporan_SIPAKATAU");
        XLSX.writeFile(wb, `Laporan_${subTab}_Kelas_${activeClassObj?.name}.xlsx`);
      };

      // Generate AI Narrative for Individual Report
      const handleGenerateAiDesc = () => {
        setAiDescLoading(true);
        setTimeout(() => {
          setAiDescLoading(false);
          setAiDescription('Berdasarkan bukti penilaian SOLO, murid sangat mahir dalam mengaitkan rasio fenotipe dan genotipe monohibrid (Relational). Disarankan untuk diberikan pengayaan persilangan Dihibrid.');
        }, 1000);
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* Submenu Navigator */}
          <div className="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-slate-200/80 shadow-sm">
            <button 
              onClick={() => setSubTab('attendance')}
              className={`px-4 py-2 text-xs font-bold rounded-xl transition ${subTab === 'attendance' ? 'bg-primary-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              1. Rekap Kehadiran
            </button>
            <button 
              onClick={() => setSubTab('class_scores')}
              className={`px-4 py-2 text-xs font-bold rounded-xl transition ${subTab === 'class_scores' ? 'bg-primary-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              2. Laporan Nilai Kelas
            </button>
            <button 
              onClick={() => setSubTab('individual')}
              className={`px-4 py-2 text-xs font-bold rounded-xl transition ${subTab === 'individual' ? 'bg-primary-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              3. Laporan Nilai Individu
            </button>
          </div>

          {/* Filter Bar & Controls */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-3">
              <div>
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Kelas</label>
                <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 outline-none">
                  {classes.map(c => <option key={c.id} value={c.id}>Kelas {c.name}</option>)}
                </select>
              </div>

              {subTab !== 'attendance' && (
                <div>
                  <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Jenis Penilaian</label>
                  <select value={reportType} onChange={e => setReportType(e.target.value)} className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 outline-none">
                    <option value="proses">Nilai Proses Pembelajaran (SOLO)</option>
                    <option value="semester">Nilai Akhir Semester</option>
                  </select>
                </div>
              )}

              {subTab === 'individual' && (
                <div>
                  <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Pilih Murid</label>
                  <select value={selectedStudentId} onChange={e => setSelectedStudentId(e.target.value)} className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 outline-none">
                    {classStudents.map(s => <option key={s.id} value={s.id}>{s.full_name}</option>)}
                  </select>
                </div>
              )}
            </div>

            <div className="flex items-center space-x-2">
              <button onClick={exportExcelReport} className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-1.5">
                <i data-lucide="file-spreadsheet" className="w-3.5 h-3.5"></i>
                <span>Ekspor Excel</span>
              </button>
              <button onClick={handlePrint} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center space-x-1.5">
                <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                <span>Cetak / Unduh PDF</span>
              </button>
            </div>
          </div>

          {/* PRINTABLE PREVIEW CONTAINER */}
          <div ref={printRef} className="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-md space-y-6 text-slate-800 font-sans">
            {/* Kop Surat Resmi */}
            <div className="border-b-4 border-double border-slate-900 pb-4 text-center relative">
              <h2 className="text-base font-extrabold uppercase tracking-wide">{school.school_name}</h2>
              <p className="text-xs">{school.address}, {school.regency}, {school.province}</p>
              <p className="text-[10px] text-slate-500">NPSN: {school.npsn} • Website Official SIPAKATAU</p>
            </div>

            {/* Document Title */}
            <div className="text-center space-y-1">
              <h3 className="font-extrabold text-sm uppercase underline decoration-2 underline-offset-4">
                {subTab === 'attendance' && 'REKAPITULASI PRESENSI KEHADIRAN MURID'}
                {subTab === 'class_scores' && `LAPORAN RESMI ${reportType === 'proses' ? 'NILAI PROSES PEMBELAJARAN (SOLO)' : 'NILAI AKHIR SEMESTER'} KELAS`}
                {subTab === 'individual' && `LAPORAN CAPAIAN BELAJAR INDIVIDU MURID`}
              </h3>
              <p className="text-xs text-slate-600">Tahun Ajaran 2025/2026 • Semester Genap</p>
            </div>

            {/* Metadata Info */}
            <div className="grid grid-cols-2 gap-4 text-xs font-medium bg-slate-50 p-3 rounded-xl border border-slate-200">
              <div>
                <p><span className="text-slate-500">Mata Pelajaran:</span> {teacher.subject}</p>
                <p><span className="text-slate-500">Guru Pengampu:</span> {teacher.full_name}</p>
              </div>
              <div>
                <p><span className="text-slate-500">Kelas:</span> {activeClassObj?.name}</p>
                <p><span className="text-slate-500">Tanggal Laporan:</span> {new Date().toLocaleDateString('id-ID')}</p>
              </div>
            </div>

            {/* Tab 1: Attendance Report Table */}
            {subTab === 'attendance' && (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse border border-slate-300 text-xs">
                  <thead>
                    <tr className="bg-slate-100 border-b border-slate-300 text-slate-700 font-bold">
                      <th className="p-2 border">No</th>
                      <th className="p-2 border">Nama Murid</th>
                      <th className="p-2 border">NIS</th>
                      <th className="p-2 border text-center">Hadir</th>
                      <th className="p-2 border text-center">Izin</th>
                      <th className="p-2 border text-center">Sakit</th>
                      <th className="p-2 border text-center">Terlambat</th>
                      <th className="p-2 border text-center">Alpa</th>
                      <th className="p-2 border text-center">% Kehadiran</th>
                    </tr>
                  </thead>
                  <tbody>
                    {classStudents.map((st, idx) => {
                      const stRecords = attendanceRecords.filter(r => r.student_id === st.id);
                      const h = stRecords.filter(r => r.status === 'Hadir').length;
                      const i = stRecords.filter(r => r.status === 'Izin').length;
                      const s = stRecords.filter(r => r.status === 'Sakit').length;
                      const t = stRecords.filter(r => r.status === 'Terlambat').length;
                      const a = stRecords.filter(r => r.status === 'Alpa').length;
                      const totalSess = attendanceSessions.filter(se => se.class_id === selectedClass).length;
                      const pct = totalSess > 0 ? Math.round(((h + t) / totalSess) * 100) : 0;

                      return (
                        <tr key={st.id} className="border-b">
                          <td className="p-2 border text-center">{idx + 1}</td>
                          <td className="p-2 border font-bold">{st.full_name}</td>
                          <td className="p-2 border font-mono">{st.nis}</td>
                          <td className="p-2 border text-center">{h}</td>
                          <td className="p-2 border text-center">{i}</td>
                          <td className="p-2 border text-center">{s}</td>
                          <td className="p-2 border text-center">{t}</td>
                          <td className="p-2 border text-center">{a}</td>
                          <td className="p-2 border text-center font-bold">{pct}%</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {/* Tab 2: Class Scores Report Table */}
            {subTab === 'class_scores' && (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse border border-slate-300 text-xs">
                  <thead>
                    <tr className="bg-slate-100 border-b border-slate-300 text-slate-700 font-bold">
                      <th className="p-2 border">No</th>
                      <th className="p-2 border">Nama Murid</th>
                      <th className="p-2 border">NIS</th>
                      {reportType === 'proses' ? (
                        <>
                          <th className="p-2 border text-center">Rata SOLO</th>
                          <th className="p-2 border text-center">Level SOLO</th>
                          <th className="p-2 border text-center">Nilai Angka</th>
                          <th className="p-2 border text-center">Status KKTP</th>
                        </>
                      ) : (
                        <>
                          <th className="p-2 border text-center">Nilai Rapor Semester</th>
                          <th className="p-2 border">Catatan Kemajuan Belajar</th>
                        </>
                      )}
                    </tr>
                  </thead>
                  <tbody>
                    {classStudents.map((st, idx) => {
                      if (reportType === 'proses') {
                        return (
                          <tr key={st.id} className="border-b">
                            <td className="p-2 border text-center">{idx + 1}</td>
                            <td className="p-2 border font-bold">{st.full_name}</td>
                            <td className="p-2 border font-mono">{st.nis}</td>
                            <td className="p-2 border text-center font-mono">3.67</td>
                            <td className="p-2 border text-center font-bold text-blue-700">Relational</td>
                            <td className="p-2 border text-center font-bold">80.36</td>
                            <td className="p-2 border text-center text-emerald-700 font-bold">Tercapai</td>
                          </tr>
                        );
                      } else {
                        const key = `${selectedClass}_${st.id}`;
                        const semItem = semesterGrades[key] || { grade: '-', notes: '-' };
                        return (
                          <tr key={st.id} className="border-b">
                            <td className="p-2 border text-center">{idx + 1}</td>
                            <td className="p-2 border font-bold">{st.full_name}</td>
                            <td className="p-2 border font-mono">{st.nis}</td>
                            <td className="p-2 border text-center font-bold font-mono">{semItem.grade || '-'}</td>
                            <td className="p-2 border">{semItem.notes || '-'}</td>
                          </tr>
                        );
                      }
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {/* Tab 3: Individual Report View */}
            {subTab === 'individual' && (
              <div className="space-y-4">
                <div className="bg-slate-50 p-4 rounded-xl border space-y-2 text-xs">
                  <h4 className="font-bold text-slate-800">Uraian Deskripsi Capaian Murid (Asisten AI)</h4>
                  <p className="text-slate-600 italic">"{aiDescription}"</p>
                  {session.role === 'teacher' && (
                    <button onClick={handleGenerateAiDesc} disabled={aiDescLoading} className="px-3 py-1 bg-purple-600 text-white text-[10px] font-bold rounded-lg shadow">
                      {aiDescLoading ? 'AI Menyusun...' : 'Generate Deskripsi AI'}
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* Official Signature Footer */}
            <div className="pt-12 grid grid-cols-2 text-center text-xs font-medium">
              <div>
                <p>Mengetahui,</p>
                <p className="font-bold">Kepala Sekolah</p>
                <div className="h-16"></div>
                <p className="font-bold underline">{school.headmaster_name}</p>
                <p className="text-[10px] text-slate-500">NIP: {school.headmaster_nip || '-'}</p>
              </div>

              <div>
                <p>{school.regency}, {new Date().toLocaleDateString('id-ID')}</p>
                <p className="font-bold">Guru Mata Pelajaran</p>
                <div className="h-16"></div>
                <p className="font-bold underline">{teacher.full_name}</p>
                <p className="text-[10px] text-slate-500">NIP: {teacher.nip || '-'}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render App
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
